# mit-motor firmware template
#
# Migrated from the RTIC `embassy-stm32g4` example
# (rtic-rs/rtic, master @ 832307d81450b87e6264f343eb419870957cbf7d,
#  examples/embassy-stm32g4).
#
# What changed for this project (STM32G491RET6):
# - `embassy-stm32` chip feature: `stm32g431cb` -> `stm32g491re`
# - `rtic` / `rtic-monotonics` / `rtic-sync`: path dependencies on the RTIC
#   workspace (`../../rtic`, ...) replaced by crates.io dependencies at the
#   SAME versions the example used (rtic 2.4.0, rtic-monotonics 3.0.0,
#   rtic-sync 1.6.0), so the template builds standalone.
# - Build target: `thumbv7m-none-eabi` -> `thumbv7em-none-eabihf`
#   (Cortex-M4F with FPU, see .cargo/config.toml).
# - Systick monotonic frequency: 25_000_000 -> 16_000_000, because
#   `embassy_stm32::init(Default::default())` runs the G4 on HSI 16 MHz
#   with no PLL (see src/bin/blinky.rs). The example's 25 MHz did not match
#   the default clock config; with it, all `Mono::delay()` timings would
#   have been 25/16x too long.
# - Everything else (dependency versions, structure, `build.rs`) is kept
#   as in the example.
#
# memory.x: there is a HAND-WRITTEN memory.x in this directory (not the
# example's auto-generated one). embassy-stm32's `memory-x` feature is
# deliberately NOT enabled: stm32-metapac 15.0.0 generates RAM = 32K for
# stm32g491re, but the reference manual (RM0440 Rev 9, section 2.4
# "Embedded SRAM", category 4 devices) gives 112K total SRAM (SRAM1 80K
# @ 0x20000000 + SRAM2 16K @ 0x20014000 + CCM 16K @ 0x10000000, aliased
# at 0x20018000, contiguous at 0x20000000). FLASH 512K @ 0x08000000.
# See memory.x for the full note.
# Do NOT re-enable `memory-x` alongside this file; the linker would see
# two memory.x files.

[package]
edition = "2021"
name = "mit-motor"
version = "0.1.0"
license = "MIT OR Apache-2.0"

[workspace]

[dependencies.rtic]
version = "2.4.0"
features = ["thumbv7-backend"]

[dependencies.rtic-monotonics]
version = "3.0.0"
features = ["cortex-m-systick"]

[dependencies.rtic-sync]
version = "1.6.0"

[dependencies]
embassy-stm32 = { version = "0.1.0", features = [ "defmt", "time-driver-any", "stm32g491re", "unstable-pac", "exti"]  }

defmt = "0.3"
defmt-rtt = "0.4"

cortex-m = { version = "0.7.6", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.0"
embedded-hal = "0.2.6"
panic-probe = { version = "0.3", features = ["print-defmt"] }

[profile.release]
debug = 2
