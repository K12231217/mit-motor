# mit-motor firmware template
#
# Migrated from the RTIC `embassy-stm32g4` example
# (rtic-rs/rtic, master @ 832307d81450b87e6264f343eb419870957cbf7d,
#  examples/embassy-stm32g4).
#
# What changed for this project (STM32G474RBT6, LQFP64, 128K Flash):
# - `embassy-stm32` chip feature: `stm32g431cb` -> `stm32g491re` ->
#   **`stm32g474rb`**. The control MCU was re-picked on 2026-11-15 and
#   locked to G474RBT6 (128K); RC/RE are the same die with more Flash.
#   The V2 board pin map is docs/hardware-requirements.md §3.
# - `rtic` / `rtic-monotonics` / `rtic-sync`: path dependencies on the RTIC
#   workspace (`../../rtic`, ...) replaced by crates.io dependencies at the
#   SAME versions the example used (rtic 2.4.0, rtic-monotonics 3.0.0,
#   rtic-sync 1.6.0), so the template builds standalone.
# - Build target: `thumbv7m-none-eabi` -> `thumbv7em-none-eabihf`
#   (Cortex-M4F with FPU, see .cargo/config.toml).
# - Systick monotonic frequency: 25_000_000 -> 16_000_000, because
#   `embassy_stm32::init(Default::default())` runs the G4 on HSI 16 MHz
#   with no PLL (see src/bin/main.rs). The example's 25 MHz did not match
#   the default clock config; with it, all `Mono::delay()` timings would
#   have been 25/16x too long.
# - Everything else (dependency versions, structure, `build.rs`) is kept
#   as in the example.
#
# memory.x: there is a HAND-WRITTEN memory.x in this directory (not the
# example's auto-generated one). embassy-stm32's `memory-x` feature is
# deliberately NOT enabled: stm32-metapac 15.0.0 gets the G4 SRAM wrong
# (32K for stm32g491re, 96K for stm32g474rb/re; both understate the part),
# so the generator is not authoritative. G474RBT6 as linked: FLASH 64K @
# 0x08000000 (bank 1 only, DBANK=1; bank 2 declared as FLASH_BANK2 and left
# unwritten this season); RAM 96K @ 0x20000000 (SRAM1 80K + SRAM2 16K,
# conservative); CCMRAM 32K @ 0x10000000 (no DMA access). These are
# conservative subsets pending a first-hand DS12288/RM0440 read. See
# memory.x for the full note.
# Do NOT re-enable `memory-x` alongside this file; the linker would see
# two memory.x files.

[features]
default = []
# HIL-only: hold DAC2/TP2 and PB7 high for 1 s at reset for probe capture.
hil-boot-freeze = []
# HIL-only: enable TIM1 with zero modulation (no motor, current-limited).
hil-enable-zero = []
# HIL-only: drive EncoderMonitor with live frames plus precomputed valid frames
# (weak field / jump / zero-frame / latch paths). No magnet needed.
hil-encoder-fsm = []
# HIL-only: log the safe-off snapshot, mark the nSLEEP->nFAULT window on PB6,
# and report wake latency. Read-only: does not enable the bridge.
hil-safety = []
# HIL-only: HR-804 DAC -> three-ADC ramp self-check. Requires the J_SYNC jumper
# connecting PA4 to the three current-sense inputs; without it the check reports
# "no correlation" instead of passing.
hil-dac-ramp = []
# HIL-only: read both calibration slots, write a known record to the older one.
hil-calib-test = []

[package]
edition = "2021"
name = "mit-motor"
version = "0.1.0"
license = "MIT OR Apache-2.0"

[workspace]

[dependencies.rtic]
version = "2.4.0"
features = ["thumbv7-backend"]

[dependencies.rtic-monotonics]
version = "3.0.0"
features = ["cortex-m-systick"]

[dependencies.rtic-sync]
version = "1.6.0"

[dependencies]
# T-011 脚手架：bsp 独立 crate；main.rs 在 T-012 迁移到它。
bsp = { path = "../bsp" }
algorithms = { path = "../algorithms" }
embassy-stm32 = { version = "0.1.0", features = [ "defmt", "time-driver-any", "stm32g474rb", "unstable-pac", "exti"]  }

defmt = "0.3"
contracts = { path = "../contracts" }
defmt-rtt = "0.4"

cortex-m = { version = "0.7.6", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.0"
embedded-hal = "0.2.6"
panic-probe = { version = "0.3", features = ["print-defmt"] }

[profile.release]
debug = 2
