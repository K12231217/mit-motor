[target.'cfg(all(target_arch = "arm", target_os = "none"))']
# Chip name as listed in `probe-rs chip list` for STM32G474RBT6
# (probe-rs 0.31.0 lists STM32G474RB; `--chip STM32G474RE` would also
# work but names the wrong density).
runner = "probe-rs run --chip STM32G474RB"

[build]
# Cortex-M4F with hardware FPU (was thumbv7m-none-eabi in the example,
# which has no FPU support).
target = "thumbv7em-none-eabihf"

[env]
# Compile-time defmt filter. `error` stays visible at every level; default is info.
# Calibration only: DEFMT_LOG="info,main=debug"
# ADC high-rate:  DEFMT_LOG="info,bsp::motor::bus_adc=trace"
DEFMT_LOG = "info"
