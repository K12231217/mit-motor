name: firmware

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # rust-toolchain.toml pins a *-pc-windows-gnu host toolchain (the primary
      # dev box has no MSVC linker). CI runs the portable stable toolchain; the
      # thumb target is the same, so the build is still representative.
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v5
        with:
          # `cargo xtask tier` diffs against a base commit; a shallow clone has
          # no base to diff against.
          fetch-depth: 0
      - run: rustup target add thumbv7em-none-eabihf
      # `cargo xtask size` uses llvm-size/llvm-objcopy from this component.
      - run: rustup component add llvm-tools
      - run: cargo xtask fmt-check
      - run: cargo xtask clippy
      - run: cargo xtask rel
      - run: cargo xtask size
      # Host workspace regression tests, then the docs and architecture invariants.
      - run: cargo xtask test
      - run: cargo xtask doc
      - run: cargo xtask arch
      # H2/H4/H5: no ownerless TODO, no history/process comments, every module
      # file listed in docs/software-architecture.md.
      - run: cargo xtask hygiene
      # H3: Tier B paths (software/firmware/, software/bsp/, software/system/, software/app/) need a
      # `HIL: PASS` line in .scratch/handoff.md. A FAIL here is the gate
      # working: keep the change on a hil-pending branch instead.
      - name: Tier gate (push)
        if: github.event_name == 'push'
        run: cargo xtask tier "${{ github.event.before }}"
      - name: Tier gate (pull_request)
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
          cargo xtask tier "origin/${{ github.base_ref }}"
