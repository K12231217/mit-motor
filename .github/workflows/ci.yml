name: firmware

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # rust-toolchain.toml pins a *-pc-windows-gnu host toolchain (the primary
      # dev box has no MSVC linker). CI runs the portable stable toolchain; the
      # thumb target is the same, so the build is still representative.
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v5
      - run: rustup target add thumbv7em-none-eabihf
      # `cargo xtask size` uses llvm-size/llvm-objcopy from this component.
      - run: rustup component add llvm-tools
      - run: cargo xtask fmt-check
      - run: cargo xtask clippy
      - run: cargo xtask rel
      - run: cargo xtask size
      # Host workspace regression tests, then the docs and architecture invariants.
      - run: cargo xtask test
      - run: cargo xtask doc
      - run: cargo xtask arch
