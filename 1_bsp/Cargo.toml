# 1_bsp —— 唯一 unsafe 层（包名 bsp）。
#
# 独立 thumb crate：根 workspace 是 host crate，不能把 embassy-stm32 并进去。
# `firmware/` 通过 path 依赖构建本 crate；`cargo xtask rel/check` 覆盖它。
[package]
name = "bsp"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

[workspace]

[dependencies]
contracts = { path = "../0_contracts" }
embassy-stm32 = { version = "0.1.0", features = ["stm32g474rb", "unstable-pac", "exti"] }
